            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: >-
            同一 Idempotency-Key 的首次请求仍在处理中（request_in_flight）；或订单不可退 / 低于起退额 / 已开票 /
