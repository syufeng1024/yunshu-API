openapi: 3.1.0
info:
  title: 云枢 API 控制面接口
  version: 0.1.0
  description: |
    T17 前端类型生成的最小骨架。只登记已验证存在的控制面路由与统一错误体；
    其余业务接口按任务卡扩充后重新生成，禁止在 web/src 手写响应类型。

    T12 已登记：/api/console/overview、/api/console/keys（列表/创建/详情/更新/删除/
    操作日志/轮换）、/api/console/models。
    T13 第一段已登记：/api/console/plans、/api/console/orders（列表/创建）、
    /api/console/redeem、公开回调 /api/v1/pay/callback/{channel}。
    T13 第二段已登记：/api/console/refunds、/api/console/invoices、
    /api/console/quota-applies、/api/console/trial/claim。
    运营后台与官网公开数据接口待 T15/T18。
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [ops]
      summary: 进程存活检查
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /readyz:
    get:
      operationId: getReadyz
      tags: [ops]
      summary: 依赖就绪检查
      responses:
        '200':
          description: 依赖全部就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: 依赖未就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /api/v1/auth/register:
    post:
      operationId: postRegister
      tags: [auth]
      summary: 邮箱/手机号 + 密码注册
      description: |
        验证码字段 `code` 当前只接受空值：非空即 400（验证码属第二段交付）。
        注册在单个事务内写 t_user、空的 t_credit_account 与审计行；
        成功返回会话 cookie、可读的 `csrf` cookie 与响应体中的 `csrf_token`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 注册成功并已登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          description: 请求体或字段不合法（invalid_request_body / invalid_field）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 邮箱或手机号已注册（account_exists）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 会话存储不可用（auth_unavailable）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/login:
    post:
      operationId: postLogin
      tags: [auth]
      summary: 邮箱/手机号 + 密码登录
      description: |
        连续失败达到阈值后按 identifier + IP 锁定，锁定期内正确密码同样返回 429。
        账号维度返回 `login_locked`，IP 维度返回 `rpm_limit_exceeded`。
        成功返回会话 cookie、可读的 `csrf` cookie 与响应体中的 `csrf_token`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          description: 请求体或字段不合法（invalid_request_body / invalid_field）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 账号或密码错误（invalid_credentials，不区分账号是否存在）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '402':
          description: 账号因欠费冻结（account_frozen_due_to_overdraft）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 账号已禁用（account_disabled）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 失败次数过多（账号维度 `login_locked`；同一 IP 维度 `rpm_limit_exceeded`。均带 retry_after_seconds / reset_at，retry_after_seconds 为剩余锁定秒数）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 会话存储或风控依赖不可用（auth_unavailable）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: 当前登录账号
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 当前账号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          description: 未登录或会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 账号不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/logout:
    post:
      operationId: postLogout
      tags: [auth]
      summary: 退出登录并清除会话
      security:
        - sessionCookie: []
      responses:
        '204':
          description: 会话已清除
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/password:
    post:
      operationId: postPasswordChange
      tags: [auth]
      summary: 修改本人密码并吊销全部会话
      description: |
        old_password 必须匹配当前 bcrypt 哈希；new_password 与注册同一规则
        （8..72 字节，不允许纯空白）。改密成功后在事务内写审计行，再删除该
        uid 的全部 K20 会话；吊销失败返回 503 而不是 204，避免旧会话继续可用。
        校验旧密码失败返回 401，且不吊销现有会话、不写成功审计。
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: 密码已更新，所有会话已吊销，cookie 已清除
        '400':
          description: 请求体或字段不合法（invalid_request_body / invalid_field）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 未登录、会话失效或旧密码错误（session_expired / invalid_credentials）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: CSRF token 缺失或不匹配（permission_denied）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 会话存储不可用，密码可能已更新（auth_unavailable）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/overview:
    get:
      operationId: getConsoleOverview
      tags: [console]
      summary: 账户概览（余额、今日用量、24h 曲线、四维额度、触顶预测）
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 概览
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
        '401':
          description: 会话失效（session_expired）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 角色缺少 user.read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/keys:
    get:
      operationId: listConsoleKeys
      tags: [console, keys]
      summary: 密钥列表（名称搜索 + 状态筛选取交集，分页）
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          schema: {type: string, maxLength: 64}
        - name: status
          in: query
          schema: {type: string, enum: [enabled, disabled]}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: sort
          in: query
          schema: {type: string, enum: [created_at, last_used_at, key_name]}
        - name: order
          in: query
          schema: {type: string, enum: [asc, desc]}
      responses:
        '200':
          description: 密钥列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyList'
        '400':
          description: 查询参数非法（invalid_query_parameter）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: createConsoleKeys
      tags: [console, keys]
      summary: 创建密钥（单条或批量 1–10；明文只在本次响应出现）
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKeyRequest'
      responses:
        '201':
          description: 创建成功；items[].key 是唯一一次明文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedKeys'
        '400':
          description: 字段非法（invalid_request_body）：含 group_code、count 超出 1–10、expire_at 不是未来时刻等
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 免费档活跃 Key 已达 quota.free_max_active_keys 上限（key_limit_reached）；message 给出上限、当前活跃数与本次新增数，hint 指向停用或升级套餐
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/keys/{id}:
    parameters:
      - $ref: '#/components/parameters/KeyID'
    get:
      operationId: getConsoleKey
      tags: [console, keys]
      summary: 密钥详情（只返回掩码；越权与不存在同为 404 key_not_found）
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyDetail'
        '404':
          description: 密钥不存在或不属于当前账号（key_not_found）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      operationId: updateConsoleKey
      tags: [console, keys]
      summary: 更新密钥（只更新传入字段；空数组与不传必须区分）
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKeyRequest'
      responses:
        '200':
          description: 更新结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateKeyResponse'
        '400':
          description: 字段非法、group_code 出现、DISABLED 未带 confirm、model_ids 为空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 密钥不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: deleteConsoleKey
      tags: [console, keys]
      summary: 软删除密钥（confirm=true；key_hash 改写为哨兵，K13 即时删除）
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: {type: boolean}
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: integer, format: int64}
                  deleted: {type: boolean}
        '400':
          description: 缺少 confirm 或出现 group_code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 密钥不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/keys/{id}/audit:
    parameters:
      - $ref: '#/components/parameters/KeyID'
    get:
      operationId: listConsoleKeyAudit
      tags: [console, keys]
      summary: 密钥操作日志（含前后值）
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: 操作日志
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyAuditList'
        '404':
          description: 密钥不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/keys/{id}/rotate:
    parameters:
      - $ref: '#/components/parameters/KeyID'
    post:
      operationId: rotateConsoleKey
      tags: [console, keys]
      summary: 重新生成密钥（旧 Key 立即失效，无宽限期）
      security:
        - sessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expire_at: {type: string, format: date-time}
      responses:
        '201':
          description: 新密钥；key 是唯一一次明文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotatedKey'
        '400':
          description: 旧 Key 已过期且未提供新的 expire_at、或出现 group_code（invalid_request_body）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 旧 Key 非活跃时轮换会新占一个名额，免费档已满（key_limit_reached）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 密钥不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/models:
    get:
      operationId: listConsoleModels
      tags: [console, models]
      summary: 模型广场（LISTED + DOMESTIC；固定推荐排序；标准价不乘分组倍率）
      security:
        - sessionCookie: []
      parameters:
        - name: model_type
          in: query
          schema: {type: string, enum: [TEXT, IMAGE, EMBEDDING]}
        - name: protocol
          in: query
          schema: {type: string}
        - name: q
          in: query
          schema: {type: string, maxLength: 128}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: 模型列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelCatalog'
        '400':
          description: 查询参数非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/plans:
    get:
      operationId: listConsolePlans
      tags: [console, fund]
      summary: 套餐档位（四档 + 默认档；全部读 t_plan，禁止硬编码）
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 档位列表与默认档元数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanList'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/orders:
    get:
      operationId: listConsoleOrders
      tags: [console, fund]
      summary: 充值订单列表（状态筛选 + 订单号搜索，交集）
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [pending, paid, closed, refunding, refunded]}
        - name: q
          in: query
          description: 订单号片段
          schema: {type: string, maxLength: 32}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: sort
          in: query
          schema: {type: string, enum: [created_at, paid_at]}
        - name: order
          in: query
          schema: {type: string, enum: [asc, desc]}
      responses:
        '200':
          description: 订单列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
        '400':
          description: 查询参数非法（invalid_query_parameter）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: createConsoleOrder
      tags: [console, fund]
      summary: 创建充值/套餐订单（金额由服务端按 t_plan 计算；PENDING 不入账）
      security:
        - sessionCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          description: 10s 去重窗口（idem.duplicate_window_seconds）；窗口内重放返回同一订单
          schema: {type: string, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: 新建订单（PENDING，积分未变）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedOrder'
        '200':
          description: 同一 Idempotency-Key 的重放，返回首次创建的订单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedOrder'
        '400':
          description: 字段非法（invalid_request_body）：order_type / plan_id / pay_amount_fen / pay_channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 同一 Idempotency-Key 的首次请求仍在处理中（request_in_flight）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/redeem:
    post:
      operationId: redeemCode
      tags: [console, fund]
      summary: 兑换码兑换积分（单次有效；不可退的赠送批次 + REDEEM 流水）
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
      responses:
        '200':
          description: 兑换成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedeemResult'
        '400':
          description: 兑换码不可用（已用 / 过期 / 不存在），message 指明 code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/pay/callback/{channel}:
    parameters:
      - name: channel
        in: path
        required: true
        schema: {type: string, enum: [wechat, alipay]}
    post:
      operationId: payCallback
      tags: [public, fund]
      summary: 支付回调（无会话；HMAC 验签 + 状态 CAS 幂等）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayCallbackRequest'
      responses:
        '200':
          description: 已处理（首次入账 / 重放 / 语义异常，见 reason）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayCallbackAck'
        '400':
          description: 字段非法或验签失败（invalid_request_body，message 指明字段）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 未知渠道（unknown_endpoint）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 验签密钥未配置（config_unavailable）；渠道应退避重试
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/refunds:
    get:
      operationId: listConsoleRefunds
      tags: [console, fund]
      summary: 退款单列表（按状态筛选）
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [applied, approved, rejected, paying, paid, failed]}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: sort
          in: query
