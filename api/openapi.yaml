        columns:
          type: array
          description: 与 CSV 表头同一份定义、同一顺序
          items: {type: string}
        items:
          type: array
          items: {$ref: '#/components/schemas/UsageRow'}
        totals: {$ref: '#/components/schemas/UsageRow'}
    BillResponse:
      type: object
      required: [month, period_start, period_end, request_total, request_success, success_rate_bp, consumed_micro, consumed_recharge_micro, consumed_bonus_micro, amount_fen, amount_yuan]
      properties:
        month: {type: string, description: YYYY-MM，CST 自然月}
        period_start: {type: string, format: date-time, description: CST 月初 00:00 对应的 UTC 时刻}
        period_end: {type: string, format: date-time, description: 下月月初 00:00 CST 对应的 UTC 时刻（不含）}
        request_total: {type: integer, format: int64, description: 当月全部请求数，含 FAILED}
        request_success: {type: integer, format: int64, description: 当月 result='SUCCESS' 的请求数}
        success_rate_bp: {type: integer, format: int64, description: request_success*10000/request_total 整数截断}
        consumed_micro: {type: integer, format: int64, description: 仅累加 SUCCESS 行}
        consumed_recharge_micro: {type: integer, format: int64}
        consumed_bonus_micro: {type: integer, format: int64}
        amount_fen: {type: integer, format: int64}
        amount_yuan: {type: string}
    ExportStartResponse:
      type: object
      required: [task_id, state]
      properties:
        task_id: {type: string, description: HMAC 签名的任务令牌，可直接用于状态查询}
        state: {type: string, enum: [RUNNING]}
    ExportStatusResponse:
      type: object
      required: [task_id, state]
      properties:
        task_id: {type: string}
        state: {type: string, enum: [RUNNING, DONE, FAILED]}
        url: {type: string, nullable: true, description: DONE 时的签名下载路径}
        expires_at: {type: string, format: date-time, nullable: true, description: 令牌失效时刻}
    RealtimeWindow:
      type: object
      required: [from, to, minutes, lag_seconds]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        minutes: {type: integer}
        lag_seconds: {type: integer, description: 实时值的展示延迟}
    UsageMetricsResponse:
      type: object
      required: [scope, scope_id, realtime_scope, realtime_source, realtime_window, realtime_request_total, realtime_request_success, realtime_request_failed, realtime_tokens_in, realtime_tokens_out, realtime_consumed_micro, realtime_consumed_fen, settled_source, settled_from, settled_until, settled_request_total, settled_request_success, settled_request_failed, settled_tokens_in, settled_tokens_out, settled_consumed_micro, settled_consumed_recharge_micro, settled_consumed_bonus_micro, settled_consumed_fen, settled_success_rate_bp]
      properties:
        scope: {type: string, enum: [user, channel]}
        scope_id: {type: integer, format: int64}
        realtime_scope: {type: string, enum: [ACCOUNT, PLATFORM]}
        realtime_source: {type: string, enum: [REDIS_K14, REDIS_K15]}
        realtime_window: {$ref: '#/components/schemas/RealtimeWindow'}
        realtime_request_total: {type: integer, format: int64}
        realtime_request_success: {type: integer, format: int64}
        realtime_request_failed: {type: integer, format: int64}
        realtime_tokens_in: {type: integer, format: int64}
        realtime_tokens_out: {type: integer, format: int64}
        realtime_consumed_micro: {type: integer, format: int64}
        realtime_consumed_fen: {type: integer, format: int64}
        settled_source: {type: string, enum: [T_METRIC_DAILY]}
        settled_from: {type: string, format: date}
        settled_until: {type: string, format: date, description: 最新完整 CST 自然日}
        settled_request_total: {type: integer, format: int64}
        settled_request_success: {type: integer, format: int64}
        settled_request_failed: {type: integer, format: int64}
        settled_tokens_in: {type: integer, format: int64}
        settled_tokens_out: {type: integer, format: int64}
        settled_consumed_micro: {type: integer, format: int64}
        settled_consumed_recharge_micro: {type: integer, format: int64}
        settled_consumed_bonus_micro: {type: integer, format: int64}
        settled_consumed_fen: {type: integer, format: int64}
        settled_success_rate_bp: {type: integer, format: int64}
    PublicPlan:
      type: object
      required: [code, name, price_fen, grant_recharge_micro, grant_bonus_micro, bonus_valid_days, rpm, tpm, concurrency, daily_quota_micro, model_scope_mode, invoice_supported, sla_text, permanent, sort_order]
      properties:
        code: {type: string, enum: [TRIAL, STANDARD, PRO, ENTERPRISE, FREE_DEFAULT]}
        name: {type: string, description: t_plan.name varchar(64)}
        price_fen: {type: integer, format: int64, description: 售价，单位分}
        grant_recharge_micro: {type: integer, format: int64, description: 到账充值积分，微积分}
        grant_bonus_micro: {type: integer, format: int64, description: 赠送积分，微积分}
        bonus_valid_days: {type: integer, description: 赠送积分有效天数}
        rpm: {type: integer}
        tpm: {type: integer}
        concurrency: {type: integer, description: 名义并发上限}
        daily_quota_micro: {type: integer, format: int64, nullable: true, description: '账户日额度；NULL = 无上限，0 = 继承上一档'}
        model_scope_mode: {type: string, description: V1.0 恒为 ALL}
        invoice_supported: {type: integer, enum: [0, 1]}
        sla_text: {type: string}
        permanent: {type: integer, enum: [0, 1]}
        sort_order: {type: integer}
    PublicPlansResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/PublicPlan'}
    PublicModel:
      type: object
      required: [id, model_name, display_name, model_type, listing_state, context_window, input_price_micro_per_k, output_price_micro_per_k, protocols, recommend_weight, published_at]
      properties:
        id: {type: string, description: t_model.id 的十进制字符串}
        model_name: {type: string, description: 客户端可传入的对外模型名}
        display_name: {type: string}
        model_type: {type: string, enum: [TEXT, IMAGE, EMBEDDING], description: 官网价格表只渲染 TEXT / IMAGE}
        listing_state: {type: string, enum: [LISTED], description: 公开列表只含 LISTED}
        context_window: {type: integer, format: int64, description: 对应 t_model.context_length}
        input_price_micro_per_k: {type: integer, format: int64, description: 当前生效价，微积分/千 token}
        output_price_micro_per_k: {type: integer, format: int64, description: 当前生效价，微积分/千 token}
        protocols:
          type: array
          description: 协议关联不到时为空数组，不猜测标签
          items: {type: string, enum: [OPENAI, ANTHROPIC]}
        recommend_weight: {type: integer, format: int64, description: 0 表示不进推荐位}
        published_at: {type: string, format: date-time, description: t_model.published_at；NULL 时回退 created_at}
    PublicModelsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/PublicModel'}
