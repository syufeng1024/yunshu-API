          description: 更新后的工单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTicket'
        '400':
          description: state 不是 CLOSED（invalid_request_body）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 角色缺少 ticket.reply（permission_denied）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 工单不存在（resource_not_found）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 工单已是 CLOSED（resource_state_conflict）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/logs:
    get:
      operationId: listConsoleLogs
      tags: [console, log]
      summary: 请求日志列表（默认近 7 天；失败请求同样出现）
      description: |
        与用量接口的过滤口径相反：这里不按 result 过滤，失败请求默认可见。
        from 早于 365 天在线窗口返回 400 并提示使用归档导出。
      security:
        - sessionCookie: []
      parameters:
        - name: from
          in: query
          description: RFC3339 或 YYYY-MM-DD；默认 now-7d
          schema: {type: string}
        - name: to
          in: query
          schema: {type: string}
        - name: state
          in: query
          schema: {type: string, enum: [all, success, failed, partial, rate_limited]}
        - name: model
          in: query
          description: 按 model_name_snap 精确匹配
          schema: {type: string, maxLength: 128}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: sort
          in: query
          schema: {type: string, enum: [created_at]}
        - name: order
          in: query
          schema: {type: string, enum: [asc, desc]}
      responses:
        '200':
          description: 日志列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogListResponse'
        '400':
          description: 查询参数非法或超出 365 天在线窗口（invalid_query_parameter）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 角色缺少 log.read（permission_denied）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/logs/{request_id}:
    parameters:
      - name: request_id
        in: path
        required: true
        schema: {type: string, maxLength: 36}
    get:
      operationId: getConsoleLogDetail
      tags: [console, log]
      summary: 单次请求元数据 + 重试时间线
      description: 366 天前的元数据仍在保留期内可查；他人 request_id 与不存在返回同一 404。
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 请求详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogDetailResponse'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 角色缺少 log.read（permission_denied）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 请求不存在或不属于当前账号（resource_not_found）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/logs/{request_id}/body:
    parameters:
      - name: request_id
        in: path
        required: true
        schema: {type: string, maxLength: 36}
    get:
      operationId: getConsoleLogBody
      tags: [console, log]
      summary: 请求正文（正文保留 180 天且 full_log_enabled）
      responses:
        '200':
          description: 正文；敏感字段已脱敏（redacted=true）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogBodyResponse'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 角色缺少 log.read（permission_denied）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 正文已过 180 天保留期或未开启 full_log_enabled（resource_not_found）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/usage:
    get:
      operationId: getConsoleUsage
      tags: [console, usage]
      summary: 用量聚合（模型/渠道/日维度；计费列仅 SUCCESS）
      description: |
        维度切换只改 GROUP BY，model_id/channel_id 等筛选条件保持并回显在 filter。
        排序为消耗积分降序、维度键升序。金额提供 amount_fen 与两位小数的 amount_yuan。
        口径分层：request_total/request_success/success_rate_bp 统计全部 result（含 FAILED）；
        tokens_in/tokens_out/consumed_* 与金额只累加 result='SUCCESS' 的行。
      security:
        - sessionCookie: []
      parameters:
        - name: from
          in: query
          description: RFC3339 或 YYYY-MM-DD；默认 now-7d；不得早于 now-365d
          schema: {type: string}
        - name: to
          in: query
          schema: {type: string}
        - name: dimension
          in: query
          schema: {type: string, enum: [model, channel, day], default: model}
        - name: model_id
          in: query
          schema: {type: integer, format: int64, minimum: 1}
        - name: channel_id
          in: query
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: 用量聚合
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageResponse'
        '400':
          description: 查询参数非法或超出 365 天在线窗口（invalid_query_parameter）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 角色缺少 usage.read（permission_denied）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/bills:
    get:
      operationId: getConsoleBill
      tags: [console, usage]
      summary: 自然月账单（CST 日界；计费列仅 SUCCESS）
      description: |
        12,345 积分 → amount_fen=12345、amount_yuan="123.45"；前端不再做除法。
        request_total/request_success/success_rate_bp 统计当月全部 result，金额与积分只累加 SUCCESS。
      security:
        - sessionCookie: []
      parameters:
        - name: month
          in: query
          description: YYYY-MM（CST 自然月）；省略为当前月
          schema: {type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$'}
      responses:
        '200':
          description: 月度账单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillResponse'
        '400':
          description: month 格式非法（invalid_query_parameter）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 角色缺少 usage.read（permission_denied）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/usage/metrics:
    get:
      operationId: getConsoleUsageMetrics
      tags: [console, usage]
      summary: 实时值（K14/K15）与历史值（t_metric_daily）分字段返回
      description: |
        realtime_* 与 settled_* 永不相加；realtime_window 与 settled_until 说明各自覆盖范围。
        scope=channel 的实时值来自 K15，是平台维度（realtime_scope=PLATFORM）。
      security:
        - sessionCookie: []
      parameters:
        - name: scope
          in: query
          schema: {type: string, enum: [user, channel], default: user}
        - name: channel_id
          in: query
          description: scope=channel 时必填
          schema: {type: integer, format: int64, minimum: 1}
        - name: days
          in: query
          description: 历史窗口的自然日数，截止到昨天（CST）
          schema: {type: integer, minimum: 1, maximum: 365, default: 7}
      responses:
        '200':
          description: 实时与历史指标
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageMetricsResponse'
        '400':
          description: scope/channel_id/days 非法（invalid_query_parameter）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 角色缺少 usage.read（permission_denied）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/usage/export:
    post:
      operationId: startConsoleUsageExport
      tags: [console, usage]
      summary: 异步生成用量 CSV（202，立即返回任务令牌）
      description: |
        单账号同时只能有 1 个任务（K27 exp:user:{uid}，TTL 1h），第二个 409。
        未配置 EXPORT_HMAC_KEY 时 503，绝不退化到无签名链接。
        CSV 表头与 usage 页一致；「请求数/成功数/成功率」统计全部 result，token 与积分类只累加 SUCCESS。
      security:
        - sessionCookie: []
      parameters:
        - name: from
          in: query
          schema: {type: string}
        - name: to
          in: query
          schema: {type: string}
        - name: dimension
          in: query
          schema: {type: string, enum: [model, channel, day], default: model}
        - name: model_id
          in: query
          schema: {type: integer, format: int64, minimum: 1}
        - name: channel_id
          in: query
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '202':
          description: 任务已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportStartResponse'
        '400':
          description: 查询参数非法或超出 365 天在线窗口（invalid_query_parameter）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 角色缺少 usage.read（permission_denied）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 已有导出任务进行中（resource_state_conflict）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 未配置 EXPORT_HMAC_KEY（config_unavailable）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/exports/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getConsoleExport
      tags: [console, usage]
      summary: 任务状态（task 令牌）或 CSV 下载（download 令牌）
      description: |
        同一路径由签名令牌的 kind 区分：task 返回 JSON 状态，dl 返回 text/csv。
        状态由“文件是否存在 + K27 是否存在”推导；令牌 1 小时过期后返回 404。
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 任务状态 JSON，或 CSV 字节流
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportStatusResponse'
            text/csv:
              schema: {type: string}
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 角色缺少 usage.read（permission_denied）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 令牌无效/过期、任务不属于当前账号或文件已失效（resource_not_found）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  # ---------------------------------------------------------------------------
  # 官网公开数据（T24 后端缺口）：无需会话、无需 CSRF，响应带 60 秒公共缓存。
  # ---------------------------------------------------------------------------
  /api/public/plans:
    get:
      operationId: getPublicPlans
      tags: [public]
      summary: 官网套餐列表
      description: |
        `SELECT ... FROM t_plan WHERE enabled=1 ORDER BY sort_order ASC`。
        无需 `sid` 会话与 `X-CSRF-Token`；响应头固定
        `Cache-Control: public, max-age=60`，500 响应不写该头。
        `daily_quota_micro` 为 NULL 时输出 JSON `null`（FREE_DEFAULT 无额度上限），
        不回退为 `0`——`0` 的语义是“继承上一档”。
      responses:
        '200':
          description: 已启用套餐，按 sort_order ASC
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPlansResponse'
        '500':
          description: 查询失败（internal_error）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/public/models:
    get:
      operationId: getPublicModels
      tags: [public]
      summary: 官网模型广场
      description: |
        只返回 `t_model.listing_state='LISTED'` 且 `deleted_at IS NULL` 的模型，
        按 `recommend_weight DESC, published_at DESC` 排序。价格取当前生效的
        MODEL 级 `t_price_rule`（`enabled=1`、`effective_from<=now`、
        `effective_to IS NULL OR > now`，`version DESC, id DESC` 取最新）。
        无生效价或价格列为 NULL 的模型整行不返回，不补 0。
        `context_window` 对应 `t_model.context_length`；`protocols` 只输出
        站点枚举内的 `OPENAI` / `ANTHROPIC`，协议关联不到时为空数组。
      responses:
        '200':
          description: 已上架且有生效价格的模型
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicModelsResponse'
        '500':
          description: 查询失败（internal_error）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/public/announcements:
    get:
      operationId: getPublicAnnouncements
      tags: [public]
      summary: 官网公告（当前生效）
      description: |
        只返回 `state='PUBLISHED'`、`effective_from<=now`、
        `effective_to IS NULL OR > now`、`deleted_at IS NULL` 的公告，
        按 `effective_from DESC` 取前 20 条。字段改名为前端契约：
        `content→body`、`ann_type→category`、`effective_from→effective_at`、
        `created_at→published_at`。`category` 取值 `PRICE` / `RATE_LIMIT` /
        `GENERAL`；V1.0 的 `PRICE_CHANGE` 映射为 `PRICE`，其余 `ann_type`
        映射为 `GENERAL`（后端暂无 `RATE_LIMIT` 枚举）。
      responses:
        '200':
          description: 已发布且在生效窗口内的公告
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAnnouncementsResponse'
        '500':
          description: 查询失败（internal_error）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/public/endpoints:
    get:
      operationId: getPublicEndpoints
      tags: [public]
      summary: 官网公开接入点（V1.0 恒为空）
      description: |
        V1.0 没有接入点数据表（全部迁移中不存在 endpoint / integration / tool
        表），`t_channel` 是上游渠道池，不得对外当作接入点。契约已固定，
        后端按 `TODO(T24)` 返回空数组，前端使用通用接入说明兜底。
      responses:
        '200':
          description: 恒为 `{"data":[]}` 直到 T24 建表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEndpointsResponse'
  /api/public/integration-links:
    get:
      operationId: getPublicIntegrationLinks
      tags: [public]
      summary: 客户端深链导入模板（V1.0 恒为空）
      description: |
        与接入点同因：V1.0 无 integration/tool 表。深链模板须由后端持有，
        浏览器不感知参数名（F4-2），因此在表与运营入口落地前返回空数组，
        不编造模板（`TODO(T24)`）。
      responses:
        '200':
          description: 恒为 `{"data":[]}` 直到 T24 建表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicIntegrationLinksResponse'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sid
      description: mw.SessionCookieName；服务端 K20 sess:admin:{sid}
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        与 `csrf` cookie 同值；所有 /api/ 下的非 GET 请求（login/register 与
        支付回调除外）都必须携带。缺失或不匹配返回 403 permission_denied。
  parameters:
    KeyID:
      name: id
      in: path
      required: true
      schema: {type: integer, format: int64}
      description: t_api_key.id；非本人 Key 与不存在同样返回 404 key_not_found
    TicketID:
      name: id
      in: path
      required: true
      schema: {type: integer, format: int64}
      description: t_ticket.id；他人工单与不存在同样返回 404 resource_not_found
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready, not_ready]
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    ErrorBody:
      type: object
      required: [type, code, message, retry_after_seconds, hint, request_id]
      properties:
        type:
          type: string
          enum:
            - authentication_error
            - authorization_error
            - invalid_request_error
            - billing_error
            - rate_limit_exceeded
            - conflict_error
            - upstream_error
            - service_unavailable_error
            - client_error
            - internal_error
        code:
          type: string
          description: 稳定错误码，取值见 PRD 附录 E.1。
        message:
          type: string
        retry_after_seconds:
          type: integer
          minimum: 0
        hint:
          type: string
          description: 可操作提示，指向一个确定页面或动作。
        request_id:
          type: string
        reset_at:
          type: string
          format: date-time
          description: 仅限限流类与 402。
        limit:
          type: integer
          description: 仅限限流类与 402。
        remaining:
          type: integer
          description: 仅限限流类与 402。
    CurrentUser:
      type: object
      required: [id, email, display_name, role, status, csrf_token]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        csrf_token:
          type: string
          description: |
            HMAC(secret, "csrf|"+sid)，与可读的 `csrf` cookie 同值；
            写请求回传到 X-CSRF-Token 头。GET /api/v1/auth/me 每次下发新 cookie
            并在响应头重复一次。
    AuthUser:
      type: object
      required: [id, email, display_name, role, status]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: 邮箱或手机号；手机号支持 +86 前缀
        password:
          type: string
          format: password
          minLength: 1
        code:
          type: string
          description: 验证码；第一段只接受空值，非空返回 400
    RegisterRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: 邮箱或手机号；手机号支持 +86 前缀
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: 8..72 字节，不可为纯空白
        code:
          type: string
          description: 验证码；第一段只接受空值，非空返回 400
        nickname:
          type: string
          maxLength: 64
          description: 去首尾空格后按 rune 计数；空则回退到 email/phone
        agreement_version:
          type: string
          maxLength: 16
    AuthSessionResponse:
      type: object
      required: [user, csrf_token]
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        csrf_token:
          type: string
          description: 与本响应 Set-Cookie 的 `csrf` 同值，见 CurrentUser.csrf_token
    PasswordChangeRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password:
          type: string
          format: password
          minLength: 1
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: 8..72 字节，不可为纯空白
    AuditLogItem:
      type: object
      required: [id, trace_id, operator_id, operator_role, operator_ip, module, action, target_type, target_id, before, after, result, created_at]
      properties:
        id: {type: integer, format: int64}
        trace_id:
          type: string
          maxLength: 32
          description: 与结构化日志的 Trace ID 一致
        operator_id:
          type: string
          description: t_admin_audit_log.operator_id 的十进制字符串
        operator_role:
          type: string
          description: PERSONAL / OPS / FINANCE / SUPER_ADMIN
        operator_ip:
          type: string
          description: varbinary(16) 还原后的字符串；无法解析时为空串
        module: {type: string, maxLength: 32}
        action: {type: string, maxLength: 32}
        target_type: {type: string, maxLength: 32}
        target_id: {type: string, maxLength: 64}
        before:
          nullable: true
          description: 操作前快照，任意 JSON；数据库为 NULL 时响应为 null
        after:
          nullable: true
          description: 操作后快照，任意 JSON；数据库为 NULL 时响应为 null
        reason:
          type: string
          maxLength: 255
          description: 调额 / 禁用 / 定价变更必填
        result: {type: string, maxLength: 24}
        created_at: {type: string, format: date-time}
    AuditLogListResponse:
      type: object
      required: [items, page, page_size, total, from, to]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogItem'
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer, format: int64}
        from: {type: string, format: date-time, description: 实际生效的窗口起点（UTC）}
        to: {type: string, format: date-time, description: 实际生效的窗口终点（UTC）}
    UserRole:
      type: string
      description: 与后端 t_user.role 同名。
      enum: [PERSONAL, OPS, FINANCE, SUPER_ADMIN]
    UserStatus:
      type: string
      description: 与后端 t_user.status 同名。
      enum: [NORMAL, DISABLED, FROZEN_OVERDRAFT]
    Overview:
      type: object
      required: [balance, today, hourly, plan, quota, eta]
      properties:
        balance:
          type: object
          required: [micro, credits, cny, recharge_micro, bonus_micro]
          properties:
            micro: {type: integer, format: int64, description: 微积分；账本唯一存储单位}
            credits: {type: string, description: 积分字符串（micro ÷ 10000），避免浮点}
            cny: {type: string, description: 人民币参考字符串（1 元 = 100 积分）}
            recharge_micro: {type: integer, format: int64}
            bonus_micro: {type: integer, format: int64}
        today:
          type: object
          required: [requests, consumed_micro, consumed_credits, success_rate_bp]
          properties:
            requests: {type: integer, format: int64}
            consumed_micro: {type: integer, format: int64}
            consumed_credits: {type: string}
            success_rate_bp:
              type: [integer, "null"]
              minimum: 0
              maximum: 10000
              description: 对内口径；分母排除 402/429，无分母时为 null
        hourly:
          type: array
          description: 固定 24 个点，按 UTC+8 小时对齐，空小时补 0
          items:
            type: object
            required: [hour, requests, consumed_micro]
            properties:
              hour: {type: string, format: date-time}
              requests: {type: integer, format: int64}
              consumed_micro: {type: integer, format: int64}
        plan:
          type: object
          required: [code, name, policy_source]
          properties:
            code: {type: string, description: TRIAL / STANDARD / PRO / ENTERPRISE / FREE_DEFAULT}
            name: {type: string}
            policy_source:
              type: string
              enum: [PLAN, TRIAL, QUOTA_APPLY, OPS_OVERRIDE, FREE_DEFAULT]
            trial_expire_at: {type: [string, "null"], format: date-time}
        quota:
          type: object
          required: [rpm, tpm, concurrency, daily_quota_micro, used_today_micro, remaining_micro]
          properties:
            rpm: {type: integer, format: int64}
            tpm: {type: integer, format: int64}
            concurrency: {type: integer, format: int64}
            daily_quota_micro:
              type: [integer, "null"]
              format: int64
              description: null = 无上限（FREE_DEFAULT），不得写成 0
            used_today_micro: {type: integer, format: int64}
            remaining_micro: {type: [integer, "null"], format: int64}
        eta:
          type: object
          required: [reachable, reason, eta_at, seconds_left, burn_micro_per_hour]
          properties:
            reachable: {type: boolean}
            reason:
              type: string
              enum: [OK, NO_DAILY_QUOTA, NO_RECENT_USAGE, QUOTA_REACHED]
            eta_at: {type: [string, "null"], format: date-time}
            seconds_left: {type: [integer, "null"], format: int64}
            burn_micro_per_hour: {type: integer, format: int64, description: 近 1 小时消耗}
    KeyList:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/KeyListItem'}
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer, format: int64}
    KeyListItem:
      type: object
      required: [id, key_name, key_masked, status, expired, group_ratio_bp, model_scope_mode]
      properties:
        id: {type: integer, format: int64}
        key_name: {type: string}
        key_masked: {type: string, description: 前 8 位 + **** + 后 4 位}
        status: {type: string, enum: [ENABLED, DISABLED]}
        expired: {type: boolean}
        group_code: {type: string, description: internal 分组不返回该字段}
        group_ratio_bp: {type: [integer, "null"]}
        model_scope_mode: {type: string, enum: [SELECTED, ALL]}
        model_count: {type: integer}
        ip_whitelist_mode: {type: string, enum: [ON, OFF]}
        ip_rule_count: {type: integer}
        expire_at: {type: [string, "null"], format: date-time}
        today_consumed_micro: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        last_used_at: {type: [string, "null"], format: date-time}
    CreateKeyRequest:
      type: object
      required: [name, expire_at]
      description: |
        四步向导参数：名称 / 模型范围 / 有效期 / IP 白名单。
        请求体出现 group_code（含 null）一律 400 invalid_request_body。
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        model_scope_mode: {type: string, enum: [SELECTED, ALL], default: SELECTED}
        model_ids:
          type: array
          description: SELECTED 时必填且非空；ALL 时必须为空
          items: {type: integer, format: int64}
        expire_at:
          type: string
          format: date-time
          description: 必须晚于当前时间；用户侧不可设永久（PRD §5.2）
        ip_allowlist:
          type: array
          description: 单 IP 或 CIDR；空数组 = ip_whitelist_mode OFF
          items: {type: string}
        count:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
          description: PRD F6-5 上限 10；免费档按整批计数，活跃数 + count 超过 quota.free_max_active_keys 整批拒绝
    CreatedKeys:
      type: object
      required: [items, count, warning]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CreatedKey'}
        count: {type: integer}
        warning: {type: string}
    CreatedKey:
      type: object
      required: [id, key_name, key, key_prefix, key_last4, key_masked, model_scope_mode, group_code, expire_at]
      properties:
        id: {type: integer, format: int64}
        key_name: {type: string}
        key: {type: string, description: 完整明文，仅创建响应出现一次；t_api_key 只存 SHA256}
        key_prefix: {type: string, description: 明文前 8 位}
        key_last4: {type: string}
        key_masked: {type: string}
        model_scope_mode: {type: string, enum: [SELECTED, ALL]}
        model_ids:
          type: array
          items: {type: integer, format: int64}
        group_code: {type: string, description: 新建恒为 standard}
        expire_at: {type: string, format: date-time}
        ip_allowlist:
          type: array
          items: {type: string}
    UpdateKeyRequest:
      type: object
      description: |
        只更新出现的字段。model_ids 传 [] 返回 400（SELECTED 不允许空白名单）；
        ip_allowlist 传 [] 表示清空并置 OFF；不传则保持原值。
        任何情况下出现 group_code 即 400。
      properties:
        key_name: {type: string, minLength: 1, maxLength: 64}
        model_ids:
          type: array
          items: {type: integer, format: int64}
        model_scope_mode: {type: string, enum: [SELECTED, ALL]}
        expire_at: {type: string, format: date-time, description: null 不被接受；永久仅运营可设}
        ip_allowlist:
          type: array
          items: {type: string}
        status: {type: string, enum: [ENABLED, DISABLED]}
        confirm: {type: boolean, description: status=DISABLED 时必填 true；转入 ENABLED 不需要}
    UpdateKeyResponse:
      type: object
      required: [changed, key_name, status, model_scope_mode, expire_at, ip_whitelist_mode, ip_allowlist]
      properties:
        changed: {type: boolean}
        key_name: {type: string}
        status: {type: string, enum: [ENABLED, DISABLED]}
        model_scope_mode: {type: string, enum: [SELECTED, ALL]}
        expire_at: {type: [string, "null"], format: date-time}
        ip_whitelist_mode: {type: string, enum: [ON, OFF]}
        ip_allowlist:
          type: array
          items: {type: string}
    KeyDetail:
      type: object
      required: [id, key_name, key_masked, key_prefix, status, expired, group_ratio_bp, model_scope_mode, models, ip_whitelist_mode, ip_allowlist, realtime, account_quota]
      properties:
        id: {type: integer, format: int64}
        key_name: {type: string}
        key_masked: {type: string}
        key_prefix: {type: string}
        status: {type: string, enum: [ENABLED, DISABLED]}
        expired: {type: boolean}
        group_code: {type: string, description: internal 分组不返回}
        group_ratio_bp: {type: [integer, "null"]}
        group_note: {type: string}
        model_scope_mode: {type: string, enum: [SELECTED, ALL]}
        models:
          type: array
          items:
            type: object
            properties:
              id: {type: integer, format: int64}
              model_name: {type: string}
              display_name: {type: string}
        ip_whitelist_mode: {type: string, enum: [ON, OFF]}
        ip_allowlist:
          type: array
          items:
            type: object
            properties:
              cidr: {type: string}
              ip_family: {type: integer, enum: [4, 6]}
              note: {type: string}
        expire_at: {type: [string, "null"], format: date-time}
        remaining_days: {type: [integer, "null"], format: int64}
        created_at: {type: string, format: date-time}
        last_used_at: {type: [string, "null"], format: date-time}
        realtime:
          type: object
          required: [as_of, available, rpm_used, rpm_limit, tpm_used, tpm_limit, concurrency_used, concurrency_limit]
          properties:
            as_of: {type: string, format: date-time}
            available: {type: boolean, description: false 时三个 used 均为 null}
            rpm_used: {type: [integer, "null"], format: int64}
            rpm_limit: {type: integer, format: int64}
            tpm_used: {type: [integer, "null"], format: int64}
            tpm_limit: {type: integer, format: int64}
            concurrency_used: {type: [integer, "null"], format: int64}
            concurrency_limit: {type: integer, format: int64}
        account_quota:
          type: object
          required: [used_today_micro, daily_quota_micro, remaining_micro, plan_code, plan_name, policy_source]
          properties:
            used_today_micro: {type: integer, format: int64}
            daily_quota_micro: {type: [integer, "null"], format: int64}
            remaining_micro: {type: [integer, "null"], format: int64}
            plan_code: {type: string}
            plan_name: {type: string}
            policy_source: {type: string}
    KeyAuditList:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            type: object
            required: [action, before, after, operator_id, created_at]
            properties:
              action:
                type: string
                description: CREATE / ROTATE / DISABLE / ENABLE / DELETE / MODEL_SCOPE_CHANGE / IP_RULE_CHANGE / RENAME / EXPIRE_CHANGE
              before: {description: 变更前（脱敏 JSON），CREATE 时为 null}
              after: {description: 变更后（脱敏 JSON）}
              operator_id: {type: string}
              created_at: {type: string, format: date-time}
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer, format: int64}
    RotatedKey:
      type: object
      required: [id, rotated_from_id, key_name, key, key_prefix, key_last4, key_masked, group_code, revocation]
      properties:
        id: {type: integer, format: int64}
        rotated_from_id: {type: integer, format: int64}
        key_name: {type: string}
        key: {type: string, description: 完整明文，仅本次响应出现}
        key_prefix: {type: string}
        key_last4: {type: string}
        key_masked: {type: string}
        group_code: {type: string, description: 继承旧 Key 分组；internal 不返回}
        expire_at: {type: [string, "null"], format: date-time}
        warning: {type: string}
        revocation: {type: string, enum: [immediate], description: T12 选择立即失效，无 5 分钟宽限}
    ModelCatalog:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ModelCatalogItem'}
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer, format: int64}
    ModelCatalogItem:
      type: object
      required: [id, model_name, display_name, model_type, context_length, protocol, aliases, capabilities, recommend_weight, published_at, pricing]
      properties:
        id: {type: integer, format: int64}
        model_name: {type: string}
        display_name: {type: string}
        model_type: {type: string, enum: [TEXT, IMAGE, EMBEDDING]}
        context_length: {type: integer, format: int64}
        protocol: {type: string}
        aliases:
          type: array
          items: {type: string}
        capabilities: {$ref: '#/components/schemas/ModelCapabilities'}
        recommend_weight: {type: integer, format: int64}
        published_at: {type: [string, "null"], format: date-time}
        pricing: {anyOf: [{$ref: '#/components/schemas/ModelPricing'}, {type: "null"}]}
    ModelCapabilities:
      type: object
      properties:
        stream: {type: [boolean, "null"], description: null = 未配置（B-53 显示「—」）}
        tool_call: {type: [boolean, "null"]}
        vision: {type: [boolean, "null"]}
        json_mode: {type: [boolean, "null"]}
    ModelPricing:
      type: object
      required: [in_price_micro_per_k, out_price_micro_per_k, per_call_price_micro, in_price_credits_per_k, out_price_credits_per_k, per_call_credits_per_call, in_price_cny_per_k, out_price_cny_per_k, per_call_cny_per_call, cache_billing_enabled]
      description: 标准单价（t_price_rule），不乘任何分组倍率
      properties:
        in_price_micro_per_k: {type: integer, format: int64}
        out_price_micro_per_k: {type: integer, format: int64}
        per_call_price_micro: {type: integer, format: int64}
        in_price_credits_per_k: {type: string}
        out_price_credits_per_k: {type: string}
        per_call_credits_per_call: {type: string}
        in_price_cny_per_k: {type: string}
        out_price_cny_per_k: {type: string}
        per_call_cny_per_call: {type: string}
        cache_billing_enabled: {type: boolean}
        cache_hit_ratio_bp: {type: [integer, "null"], description: pricing.cache_billing_enabled=false 时不返回}
        cache_write_ratio_bp: {type: [integer, "null"]}
        cache_hit_price_credits_per_k: {type: [string, "null"]}
        cache_write_price_credits_per_k: {type: [string, "null"]}

    # ---------------------------------------------------------------------
    # T13 第一段：套餐 / 订单 / 兑换 / 支付回调
    # ---------------------------------------------------------------------
    Plan:
      type: object
      required: [id, code, name, price_fen, price_yuan, grant_recharge_micro, grant_bonus_micro,
                 bonus_valid_days, rpm, tpm, concurrency, permanent, purchasable, sort_order]
      description: 一个档位；全部数值来自 t_plan（PRD §3.2.1 为唯一来源）
      properties:
        id: {type: integer, format: int64}
        code: {type: string, description: "TRIAL / STANDARD / PRO / ENTERPRISE / FREE_DEFAULT"}
        name: {type: string}
        price_fen: {type: integer, format: int64, description: 售价（分）}
        price_yuan: {type: integer, format: int64, description: 售价（元，整数展示）}
        grant_recharge_micro: {type: integer, format: int64, description: 充值积分（微积分）}
        grant_bonus_micro: {type: integer, format: int64, description: 赠送积分（微积分）}
        grant_recharge: {type: integer, format: int64, description: 充值积分（积分）}
        grant_bonus: {type: integer, format: int64, description: 赠送积分（积分）}
        bonus_valid_days: {type: integer, format: int64}
        rpm: {type: integer, format: int64}
        tpm: {type: integer, format: int64}
        concurrency: {type: integer, format: int64}
        daily_quota_micro: {type: [integer, "null"], format: int64, description: "null = 无上限（默认档）"}
        daily_quota: {type: [integer, "null"], format: int64, description: "账户日额度（积分）"}
        permanent: {type: boolean, description: "权益有效期永久（付费三档为 true）"}
        purchasable: {type: boolean, description: "price_fen > 0；默认档与体验档为 false"}
        sort_order: {type: integer, format: int64, description: 档位顺序：体验 < 标准 < 专业 < 企业}
    PlanList:
      type: object
      required: [items, default_tier, default_tier_label, trial_days, bonus_expire_days, micro_per_credit]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Plan'}
        default_tier: {type: string, description: 未购套餐时的档位 code（FREE_DEFAULT）}
        default_tier_label: {type: string, description: plan.default_tier 配置值}
        trial_days: {type: integer, format: int64, description: plan.trial_days}
        bonus_expire_days: {type: integer, format: int64, description: billing.bonus_expire_days}
        micro_per_credit: {type: integer, format: int64, description: 恒为 10000}
    Order:
      type: object
      required: [id, order_no, order_type, pay_amount_fen, pay_amount_yuan,
                 recharge_micro, bonus_micro, pay_channel, state, expire_at, created_at]
      properties:
        id: {type: integer, format: int64}
        order_no: {type: string, description: yyyymmddHHmmss + 14 位随机（28 字符）}
        order_type: {type: string, enum: [CUSTOM, PLAN]}
        plan_code: {type: string}
        pay_amount_fen: {type: integer, format: int64, description: 实付（分）}
        pay_amount_yuan: {type: integer, format: int64}
        recharge_micro: {type: integer, format: int64}
        bonus_micro: {type: integer, format: int64}
        recharge: {type: integer, format: int64}
        bonus: {type: integer, format: int64}
        pay_channel: {type: string, enum: [WECHAT, ALIPAY]}
        state: {type: string, enum: [PENDING, PAID, CLOSED, REFUNDING, REFUNDED, PARTIAL_REFUNDED]}
        paid_at: {type: [string, "null"], format: date-time}
        expire_at: {type: string, format: date-time, description: 下单 + 30 分钟}
        created_at: {type: string, format: date-time}
    OrderList:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Order'}
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer, format: int64}
    CreateOrderRequest:
      type: object
      required: [order_type, pay_channel]
      properties:
        order_type: {type: string, enum: [CUSTOM, PLAN]}
        plan_id: {type: integer, format: int64, description: "PLAN 必填；CUSTOM 不得出现"}
        pay_amount_fen: {type: integer, format: int64, description: "CUSTOM 必填（1~5000000）；PLAN 若传必须等于档位价"}
        pay_channel: {type: string, enum: [WECHAT, ALIPAY], description: "OFFLINE（对公转账）不走自动回调，V1.0 不开放"}
        idempotency_key: {type: string, maxLength: 128, description: "也可用同名请求头；10s 窗口"}
    CreatedOrder:
      type: object
      required: [order, idempotent_replay]
      properties:
        order: {$ref: '#/components/schemas/Order'}
        idempotent_replay: {type: boolean, description: true = 同一 Idempotency-Key 的重放，未新建订单}
    RedeemRequest:
      type: object
      required: [code]
      properties:
        code: {type: string, minLength: 6, maxLength: 64, description: 兑换码明文；服务端只存 SHA-256}
    RedeemResult:
      type: object
      required: [batch_name, amount_micro, amount, credit_target, expire_at, balance_after_micro]
      properties:
        batch_name: {type: string}
        amount_micro: {type: integer, format: int64}
        amount: {type: integer, format: int64, description: 积分}
        credit_target: {type: string, enum: [BONUS, RECHARGE], description: "B-44 A 档固定 BONUS（不可退）"}
        expire_at: {type: string, format: date-time}
        balance_after_micro: {type: integer, format: int64}
    PayCallbackRequest:
      type: object
      required: [out_trade_no, trade_no, amount_fen, status, sign]
      properties:
        out_trade_no: {type: string, maxLength: 28, description: 本平台订单号}
        trade_no: {type: string, maxLength: 64, description: 渠道流水号（uk_ro_pay_txn 幂等键）}
        amount_fen: {type: integer, format: int64, description: 实付（分），必须与订单一致且参与验签}
        status: {type: string, enum: [SUCCESS, FAILED]}
        sign: {type: string, description: "hex(HMAC-SHA256(secret, out_trade_no|trade_no|amount_fen|status))"}
    PayCallbackAck:
      type: object
      required: [code, credited, replayed]
      properties:
        code: {type: string, description: 固定 SUCCESS（渠道约定，非统一错误体）}
        order_no: {type: string}
        credited: {type: boolean, description: true = 本次或此前已入账}
        replayed: {type: boolean, description: true = 重复通知，未重复入账}
