openapi: 3.1.0
info:
  title: 云枢 API 控制面接口
  version: 0.1.0
  description: |
    T17 前端类型生成的最小骨架。只登记已验证存在的控制面路由与统一错误体；
    其余业务接口按任务卡扩充后重新生成，禁止在 web/src 手写响应类型。

    T12 已登记：/api/console/overview、/api/console/keys（列表/创建/详情/更新/删除/
    操作日志/轮换）、/api/console/models。
    T13 第一段已登记：/api/console/plans、/api/console/orders（列表/创建）、
    /api/console/redeem、公开回调 /api/v1/pay/callback/{channel}。
    T13 第二段已登记：/api/console/refunds、/api/console/invoices、
    /api/console/quota-applies、/api/console/trial/claim。
    运营后台与官网公开数据接口待 T15/T18。
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [ops]
      summary: 进程存活检查
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /readyz:
    get:
      operationId: getReadyz
      tags: [ops]
      summary: 依赖就绪检查
      responses:
        '200':
          description: 依赖全部就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: 依赖未就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: 当前登录账号
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 当前账号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          description: 未登录或会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 账号不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/logout:
    post:
      operationId: postLogout
      tags: [auth]
      summary: 退出登录并清除会话
      security:
        - sessionCookie: []
      responses:
        '204':
          description: 会话已清除
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/overview:
    get:
      operationId: getConsoleOverview
      tags: [console]
      summary: 账户概览（余额、今日用量、24h 曲线、四维额度、触顶预测）
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 概览
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
        '401':
          description: 会话失效（session_expired）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 角色缺少 user.read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/keys:
    get:
      operationId: listConsoleKeys
      tags: [console, keys]
      summary: 密钥列表（名称搜索 + 状态筛选取交集，分页）
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          schema: {type: string, maxLength: 64}
        - name: status
          in: query
          schema: {type: string, enum: [enabled, disabled]}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: sort
          in: query
          schema: {type: string, enum: [created_at, last_used_at, key_name]}
        - name: order
          in: query
          schema: {type: string, enum: [asc, desc]}
      responses:
        '200':
          description: 密钥列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyList'
        '400':
          description: 查询参数非法（invalid_query_parameter）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: createConsoleKeys
      tags: [console, keys]
      summary: 创建密钥（单条或批量 1–10；明文只在本次响应出现）
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKeyRequest'
      responses:
        '201':
          description: 创建成功；items[].key 是唯一一次明文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedKeys'
        '400':
          description: 字段非法（invalid_request_body）：含 group_code、count 超出 1–10、expire_at 不是未来时刻等
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 免费档活跃 Key 已达 quota.free_max_active_keys 上限（key_limit_reached）；message 给出上限、当前活跃数与本次新增数，hint 指向停用或升级套餐
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/keys/{id}:
    parameters:
      - $ref: '#/components/parameters/KeyID'
    get:
      operationId: getConsoleKey
      tags: [console, keys]
      summary: 密钥详情（只返回掩码；越权与不存在同为 404 key_not_found）
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyDetail'
        '404':
          description: 密钥不存在或不属于当前账号（key_not_found）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      operationId: updateConsoleKey
      tags: [console, keys]
      summary: 更新密钥（只更新传入字段；空数组与不传必须区分）
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKeyRequest'
      responses:
        '200':
          description: 更新结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateKeyResponse'
        '400':
          description: 字段非法、group_code 出现、DISABLED 未带 confirm、model_ids 为空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 密钥不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: deleteConsoleKey
      tags: [console, keys]
      summary: 软删除密钥（confirm=true；key_hash 改写为哨兵，K13 即时删除）
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: {type: boolean}
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: integer, format: int64}
                  deleted: {type: boolean}
        '400':
          description: 缺少 confirm 或出现 group_code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 密钥不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/keys/{id}/audit:
    parameters:
      - $ref: '#/components/parameters/KeyID'
    get:
      operationId: listConsoleKeyAudit
      tags: [console, keys]
      summary: 密钥操作日志（含前后值）
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: 操作日志
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyAuditList'
        '404':
          description: 密钥不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/keys/{id}/rotate:
    parameters:
      - $ref: '#/components/parameters/KeyID'
    post:
      operationId: rotateConsoleKey
      tags: [console, keys]
      summary: 重新生成密钥（旧 Key 立即失效，无宽限期）
      security:
        - sessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expire_at: {type: string, format: date-time}
      responses:
        '201':
          description: 新密钥；key 是唯一一次明文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotatedKey'
        '400':
          description: 旧 Key 已过期且未提供新的 expire_at、或出现 group_code（invalid_request_body）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 旧 Key 非活跃时轮换会新占一个名额，免费档已满（key_limit_reached）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 密钥不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/models:
    get:
      operationId: listConsoleModels
      tags: [console, models]
      summary: 模型广场（LISTED + DOMESTIC；固定推荐排序；标准价不乘分组倍率）
      security:
        - sessionCookie: []
      parameters:
        - name: model_type
          in: query
          schema: {type: string, enum: [TEXT, IMAGE, EMBEDDING]}
        - name: protocol
          in: query
          schema: {type: string}
        - name: q
          in: query
          schema: {type: string, maxLength: 128}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: 模型列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelCatalog'
        '400':
          description: 查询参数非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/plans:
    get:
      operationId: listConsolePlans
      tags: [console, fund]
      summary: 套餐档位（四档 + 默认档；全部读 t_plan，禁止硬编码）
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 档位列表与默认档元数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanList'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/orders:
    get:
      operationId: listConsoleOrders
      tags: [console, fund]
      summary: 充值订单列表（状态筛选 + 订单号搜索，交集）
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [pending, paid, closed, refunding, refunded]}
        - name: q
          in: query
          description: 订单号片段
          schema: {type: string, maxLength: 32}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: sort
          in: query
          schema: {type: string, enum: [created_at, paid_at]}
        - name: order
          in: query
          schema: {type: string, enum: [asc, desc]}
      responses:
        '200':
          description: 订单列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
        '400':
          description: 查询参数非法（invalid_query_parameter）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: createConsoleOrder
      tags: [console, fund]
      summary: 创建充值/套餐订单（金额由服务端按 t_plan 计算；PENDING 不入账）
      security:
        - sessionCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          description: 10s 去重窗口（idem.duplicate_window_seconds）；窗口内重放返回同一订单
          schema: {type: string, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: 新建订单（PENDING，积分未变）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedOrder'
        '200':
          description: 同一 Idempotency-Key 的重放，返回首次创建的订单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedOrder'
        '400':
          description: 字段非法（invalid_request_body）：order_type / plan_id / pay_amount_fen / pay_channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 同一 Idempotency-Key 的首次请求仍在处理中（request_in_flight）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/redeem:
    post:
      operationId: redeemCode
      tags: [console, fund]
      summary: 兑换码兑换积分（单次有效；不可退的赠送批次 + REDEEM 流水）
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
      responses:
        '200':
          description: 兑换成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedeemResult'
        '400':
          description: 兑换码不可用（已用 / 过期 / 不存在），message 指明 code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/pay/callback/{channel}:
    parameters:
      - name: channel
        in: path
        required: true
        schema: {type: string, enum: [wechat, alipay]}
    post:
      operationId: payCallback
      tags: [public, fund]
      summary: 支付回调（无会话；HMAC 验签 + 状态 CAS 幂等）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayCallbackRequest'
      responses:
        '200':
          description: 已处理（首次入账 / 重放 / 语义异常，见 reason）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayCallbackAck'
        '400':
          description: 字段非法或验签失败（invalid_request_body，message 指明字段）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 未知渠道（unknown_endpoint）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 验签密钥未配置（config_unavailable）；渠道应退避重试
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/refunds:
    get:
      operationId: listConsoleRefunds
      tags: [console, fund]
      summary: 退款单列表（按状态筛选）
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [applied, approved, rejected, paying, paid, failed]}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: sort
          in: query
          schema: {type: string, enum: [created_at, paid_at]}
        - name: order
          in: query
          schema: {type: string, enum: [asc, desc]}
      responses:
        '200':
          description: 退款单列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundList'
        '400':
          description: 查询参数非法（invalid_query_parameter）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: createConsoleRefund
      tags: [console, fund]
      summary: 申请退款（只退未消耗充值积分；申请即冻结；赠送积分不可退）
      security:
        - sessionCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          description: 10s 去重窗口；窗口内重放返回同一退款单
          schema: {type: string, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRefundRequest'
      responses:
        '201':
          description: 已受理（APPLIED，已冻结对应余额）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedRefund'
        '200':
          description: 同一 Idempotency-Key 的重放
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedRefund'
        '400':
          description: order_id 非法 / 订单不可退 / 低于起退额 / 已开票 / 已有进行中的退款（invalid_request_body，message 带原因）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 同一 Idempotency-Key 的首次请求仍在处理中（request_in_flight）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/invoices:
    get:
      operationId: listConsoleInvoices
      tags: [console, fund]
      summary: 开票申请列表
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [applied, approved, issued, rejected, voided]}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: sort
          in: query
          schema: {type: string, enum: [created_at, issued_at]}
        - name: order
          in: query
          schema: {type: string, enum: [asc, desc]}
      responses:
        '200':
          description: 开票申请列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceList'
        '400':
          description: 查询参数非法（invalid_query_parameter）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: createConsoleInvoice
      tags: [console, fund]
      summary: 申请开票（需实名；金额上限 = 实付 − 已开票）
      security:
        - sessionCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          description: 10s 去重窗口
          schema: {type: string, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvoiceRequest'
      responses:
        '201':
          description: 已受理（APPLIED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedInvoice'
        '200':
          description: 同一 Idempotency-Key 的重放
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedInvoice'
        '400':
          description: 字段非法 / 金额超过可开额度 / 同订单已有处理中的申请（invalid_request_body）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 未实名（account_not_verified）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/quota-applies:
    get:
      operationId: listConsoleQuotaApplies
      tags: [console, fund]
      summary: 提额申请列表
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [pending, approved, rejected, expired]}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: sort
          in: query
          schema: {type: string, enum: [created_at, audited_at]}
        - name: order
          in: query
          schema: {type: string, enum: [asc, desc]}
      responses:
        '200':
          description: 提额申请列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaApplyList'
        '400':
          description: 查询参数非法（invalid_query_parameter）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: createConsoleQuotaApply
      tags: [console, fund]
      summary: 提交提额申请（目标 ≤ 当前日额度 × 5；审批前额度不变）
      security:
        - sessionCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          description: 10s 去重窗口
          schema: {type: string, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuotaApplyRequest'
      responses:
        '201':
          description: 已提交（PENDING）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedQuotaApply'
        '200':
          description: 同一 Idempotency-Key 的重放
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedQuotaApply'
        '400':
          description: 字段非法 / 超过 5 倍上限 / 当前套餐无日额度（invalid_request_body）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/trial/claim:
    post:
      operationId: claimTrial
      tags: [console, fund]
      summary: 领取体验版（设备指纹 + 手机号 + IP 段任一命中即拒）
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrialClaimRequest'
      responses:
        '200':
          description: 领取成功（TRIAL 套餐 + 7,000 赠送积分，90 天有效）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrialClaimResult'
        '400':
          description: 指纹非法 / 任一防刷因子命中（invalid_request_body，message 指明缺哪一项）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: FP_HMAC_KEY 未配置（config_unavailable）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sid
      description: mw.SessionCookieName；服务端 K20 sess:admin:{sid}
  parameters:
    KeyID:
      name: id
      in: path
      required: true
      schema: {type: integer, format: int64}
      description: t_api_key.id；非本人 Key 与不存在同样返回 404 key_not_found
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready, not_ready]
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    ErrorBody:
      type: object
      required: [type, code, message, retry_after_seconds, hint, request_id]
      properties:
        type:
          type: string
          enum:
            - authentication_error
            - authorization_error
            - invalid_request_error
            - billing_error
            - rate_limit_exceeded
            - conflict_error
            - upstream_error
            - service_unavailable_error
            - client_error
            - internal_error
        code:
          type: string
          description: 稳定错误码，取值见 PRD 附录 E.1。
        message:
          type: string
        retry_after_seconds:
          type: integer
          minimum: 0
        hint:
          type: string
          description: 可操作提示，指向一个确定页面或动作。
        request_id:
          type: string
        reset_at:
          type: string
          format: date-time
          description: 仅限限流类与 402。
        limit:
          type: integer
          description: 仅限限流类与 402。
        remaining:
          type: integer
          description: 仅限限流类与 402。
    CurrentUser:
      type: object
      required: [id, email, display_name, role, status]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
    UserRole:
      type: string
      description: 与后端 t_user.role 同名。
      enum: [PERSONAL, OPS, FINANCE, SUPER_ADMIN]
    UserStatus:
      type: string
      description: 与后端 t_user.status 同名。
      enum: [NORMAL, DISABLED, FROZEN_OVERDRAFT]
    Overview:
      type: object
      required: [balance, today, hourly, plan, quota, eta]
      properties:
        balance:
          type: object
          required: [micro, credits, cny, recharge_micro, bonus_micro]
          properties:
            micro: {type: integer, format: int64, description: 微积分；账本唯一存储单位}
            credits: {type: string, description: 积分字符串（micro ÷ 10000），避免浮点}
            cny: {type: string, description: 人民币参考字符串（1 元 = 100 积分）}
            recharge_micro: {type: integer, format: int64}
            bonus_micro: {type: integer, format: int64}
        today:
          type: object
          required: [requests, consumed_micro, consumed_credits, success_rate_bp]
          properties:
            requests: {type: integer, format: int64}
            consumed_micro: {type: integer, format: int64}
            consumed_credits: {type: string}
            success_rate_bp:
              type: [integer, "null"]
              minimum: 0
              maximum: 10000
              description: 对内口径；分母排除 402/429，无分母时为 null
        hourly:
          type: array
          description: 固定 24 个点，按 UTC+8 小时对齐，空小时补 0
          items:
            type: object
            required: [hour, requests, consumed_micro]
            properties:
              hour: {type: string, format: date-time}
              requests: {type: integer, format: int64}
              consumed_micro: {type: integer, format: int64}
        plan:
          type: object
          required: [code, name, policy_source]
          properties:
            code: {type: string, description: TRIAL / STANDARD / PRO / ENTERPRISE / FREE_DEFAULT}
            name: {type: string}
            policy_source:
              type: string
              enum: [PLAN, TRIAL, QUOTA_APPLY, OPS_OVERRIDE, FREE_DEFAULT]
            trial_expire_at: {type: [string, "null"], format: date-time}
        quota:
          type: object
          required: [rpm, tpm, concurrency, daily_quota_micro, used_today_micro, remaining_micro]
          properties:
            rpm: {type: integer, format: int64}
            tpm: {type: integer, format: int64}
            concurrency: {type: integer, format: int64}
            daily_quota_micro:
              type: [integer, "null"]
              format: int64
              description: null = 无上限（FREE_DEFAULT），不得写成 0
            used_today_micro: {type: integer, format: int64}
            remaining_micro: {type: [integer, "null"], format: int64}
        eta:
          type: object
          required: [reachable, reason, eta_at, seconds_left, burn_micro_per_hour]
          properties:
            reachable: {type: boolean}
            reason:
              type: string
              enum: [OK, NO_DAILY_QUOTA, NO_RECENT_USAGE, QUOTA_REACHED]
            eta_at: {type: [string, "null"], format: date-time}
            seconds_left: {type: [integer, "null"], format: int64}
            burn_micro_per_hour: {type: integer, format: int64, description: 近 1 小时消耗}
    KeyList:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/KeyListItem'}
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer, format: int64}
    KeyListItem:
      type: object
      required: [id, key_name, key_masked, status, expired, group_ratio_bp, model_scope_mode]
      properties:
        id: {type: integer, format: int64}
        key_name: {type: string}
        key_masked: {type: string, description: 前 8 位 + **** + 后 4 位}
        status: {type: string, enum: [ENABLED, DISABLED]}
        expired: {type: boolean}
        group_code: {type: string, description: internal 分组不返回该字段}
        group_ratio_bp: {type: [integer, "null"]}
        model_scope_mode: {type: string, enum: [SELECTED, ALL]}
        model_count: {type: integer}
        ip_whitelist_mode: {type: string, enum: [ON, OFF]}
        ip_rule_count: {type: integer}
        expire_at: {type: [string, "null"], format: date-time}
        today_consumed_micro: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        last_used_at: {type: [string, "null"], format: date-time}
    CreateKeyRequest:
      type: object
      required: [name, expire_at]
      description: |
        四步向导参数：名称 / 模型范围 / 有效期 / IP 白名单。
        请求体出现 group_code（含 null）一律 400 invalid_request_body。
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        model_scope_mode: {type: string, enum: [SELECTED, ALL], default: SELECTED}
        model_ids:
          type: array
          description: SELECTED 时必填且非空；ALL 时必须为空
          items: {type: integer, format: int64}
        expire_at:
          type: string
          format: date-time
          description: 必须晚于当前时间；用户侧不可设永久（PRD §5.2）
        ip_allowlist:
          type: array
          description: 单 IP 或 CIDR；空数组 = ip_whitelist_mode OFF
          items: {type: string}
        count:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
          description: PRD F6-5 上限 10；免费档按整批计数，活跃数 + count 超过 quota.free_max_active_keys 整批拒绝
    CreatedKeys:
      type: object
      required: [items, count, warning]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CreatedKey'}
        count: {type: integer}
        warning: {type: string}
    CreatedKey:
      type: object
      required: [id, key_name, key, key_prefix, key_last4, key_masked, model_scope_mode, group_code, expire_at]
      properties:
        id: {type: integer, format: int64}
        key_name: {type: string}
        key: {type: string, description: 完整明文，仅创建响应出现一次；t_api_key 只存 SHA256}
        key_prefix: {type: string, description: 明文前 8 位}
        key_last4: {type: string}
        key_masked: {type: string}
        model_scope_mode: {type: string, enum: [SELECTED, ALL]}
        model_ids:
          type: array
          items: {type: integer, format: int64}
        group_code: {type: string, description: 新建恒为 standard}
        expire_at: {type: string, format: date-time}
        ip_allowlist:
          type: array
          items: {type: string}
    UpdateKeyRequest:
      type: object
      description: |
        只更新出现的字段。model_ids 传 [] 返回 400（SELECTED 不允许空白名单）；
        ip_allowlist 传 [] 表示清空并置 OFF；不传则保持原值。
        任何情况下出现 group_code 即 400。
      properties:
        key_name: {type: string, minLength: 1, maxLength: 64}
        model_ids:
          type: array
          items: {type: integer, format: int64}
        model_scope_mode: {type: string, enum: [SELECTED, ALL]}
        expire_at: {type: string, format: date-time, description: null 不被接受；永久仅运营可设}
        ip_allowlist:
          type: array
          items: {type: string}
        status: {type: string, enum: [ENABLED, DISABLED]}
        confirm: {type: boolean, description: status=DISABLED 时必填 true；转入 ENABLED 不需要}
    UpdateKeyResponse:
      type: object
      required: [changed, key_name, status, model_scope_mode, expire_at, ip_whitelist_mode, ip_allowlist]
      properties:
        changed: {type: boolean}
        key_name: {type: string}
        status: {type: string, enum: [ENABLED, DISABLED]}
        model_scope_mode: {type: string, enum: [SELECTED, ALL]}
        expire_at: {type: [string, "null"], format: date-time}
        ip_whitelist_mode: {type: string, enum: [ON, OFF]}
        ip_allowlist:
          type: array
          items: {type: string}
    KeyDetail:
      type: object
      required: [id, key_name, key_masked, key_prefix, status, expired, group_ratio_bp, model_scope_mode, models, ip_whitelist_mode, ip_allowlist, realtime, account_quota]
      properties:
        id: {type: integer, format: int64}
        key_name: {type: string}
        key_masked: {type: string}
        key_prefix: {type: string}
        status: {type: string, enum: [ENABLED, DISABLED]}
        expired: {type: boolean}
        group_code: {type: string, description: internal 分组不返回}
        group_ratio_bp: {type: [integer, "null"]}
        group_note: {type: string}
        model_scope_mode: {type: string, enum: [SELECTED, ALL]}
        models:
          type: array
          items:
            type: object
            properties:
              id: {type: integer, format: int64}
              model_name: {type: string}
              display_name: {type: string}
        ip_whitelist_mode: {type: string, enum: [ON, OFF]}
        ip_allowlist:
          type: array
          items:
            type: object
            properties:
              cidr: {type: string}
              ip_family: {type: integer, enum: [4, 6]}
              note: {type: string}
        expire_at: {type: [string, "null"], format: date-time}
        remaining_days: {type: [integer, "null"], format: int64}
        created_at: {type: string, format: date-time}
        last_used_at: {type: [string, "null"], format: date-time}
        realtime:
          type: object
          required: [as_of, available, rpm_used, rpm_limit, tpm_used, tpm_limit, concurrency_used, concurrency_limit]
          properties:
            as_of: {type: string, format: date-time}
            available: {type: boolean, description: false 时三个 used 均为 null}
            rpm_used: {type: [integer, "null"], format: int64}
            rpm_limit: {type: integer, format: int64}
            tpm_used: {type: [integer, "null"], format: int64}
            tpm_limit: {type: integer, format: int64}
            concurrency_used: {type: [integer, "null"], format: int64}
            concurrency_limit: {type: integer, format: int64}
        account_quota:
          type: object
          required: [used_today_micro, daily_quota_micro, remaining_micro, plan_code, plan_name, policy_source]
          properties:
            used_today_micro: {type: integer, format: int64}
            daily_quota_micro: {type: [integer, "null"], format: int64}
            remaining_micro: {type: [integer, "null"], format: int64}
            plan_code: {type: string}
            plan_name: {type: string}
            policy_source: {type: string}
    KeyAuditList:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            type: object
            required: [action, before, after, operator_id, created_at]
            properties:
              action:
                type: string
                description: CREATE / ROTATE / DISABLE / ENABLE / DELETE / MODEL_SCOPE_CHANGE / IP_RULE_CHANGE / RENAME / EXPIRE_CHANGE
              before: {description: 变更前（脱敏 JSON），CREATE 时为 null}
              after: {description: 变更后（脱敏 JSON）}
              operator_id: {type: string}
              created_at: {type: string, format: date-time}
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer, format: int64}
    RotatedKey:
      type: object
      required: [id, rotated_from_id, key_name, key, key_prefix, key_last4, key_masked, group_code, revocation]
      properties:
        id: {type: integer, format: int64}
        rotated_from_id: {type: integer, format: int64}
        key_name: {type: string}
        key: {type: string, description: 完整明文，仅本次响应出现}
        key_prefix: {type: string}
        key_last4: {type: string}
        key_masked: {type: string}
        group_code: {type: string, description: 继承旧 Key 分组；internal 不返回}
        expire_at: {type: [string, "null"], format: date-time}
        warning: {type: string}
        revocation: {type: string, enum: [immediate], description: T12 选择立即失效，无 5 分钟宽限}
    ModelCatalog:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ModelCatalogItem'}
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer, format: int64}
    ModelCatalogItem:
      type: object
      required: [id, model_name, display_name, model_type, context_length, protocol, aliases, capabilities, recommend_weight, published_at, pricing]
      properties:
        id: {type: integer, format: int64}
        model_name: {type: string}
        display_name: {type: string}
        model_type: {type: string, enum: [TEXT, IMAGE, EMBEDDING]}
        context_length: {type: integer, format: int64}
        protocol: {type: string}
        aliases:
          type: array
          items: {type: string}
        capabilities: {$ref: '#/components/schemas/ModelCapabilities'}
        recommend_weight: {type: integer, format: int64}
        published_at: {type: [string, "null"], format: date-time}
        pricing: {anyOf: [{$ref: '#/components/schemas/ModelPricing'}, {type: "null"}]}
    ModelCapabilities:
      type: object
      properties:
        stream: {type: [boolean, "null"], description: null = 未配置（B-53 显示「—」）}
        tool_call: {type: [boolean, "null"]}
        vision: {type: [boolean, "null"]}
        json_mode: {type: [boolean, "null"]}
    ModelPricing:
      type: object
      required: [in_price_micro_per_k, out_price_micro_per_k, per_call_price_micro, in_price_credits_per_k, out_price_credits_per_k, per_call_credits_per_call, in_price_cny_per_k, out_price_cny_per_k, per_call_cny_per_call, cache_billing_enabled]
      description: 标准单价（t_price_rule），不乘任何分组倍率
      properties:
        in_price_micro_per_k: {type: integer, format: int64}
        out_price_micro_per_k: {type: integer, format: int64}
        per_call_price_micro: {type: integer, format: int64}
        in_price_credits_per_k: {type: string}
        out_price_credits_per_k: {type: string}
        per_call_credits_per_call: {type: string}
        in_price_cny_per_k: {type: string}
        out_price_cny_per_k: {type: string}
        per_call_cny_per_call: {type: string}
        cache_billing_enabled: {type: boolean}
        cache_hit_ratio_bp: {type: [integer, "null"], description: pricing.cache_billing_enabled=false 时不返回}
        cache_write_ratio_bp: {type: [integer, "null"]}
        cache_hit_price_credits_per_k: {type: [string, "null"]}
        cache_write_price_credits_per_k: {type: [string, "null"]}

    # ---------------------------------------------------------------------
    # T13 第一段：套餐 / 订单 / 兑换 / 支付回调
    # ---------------------------------------------------------------------
    Plan:
      type: object
      required: [id, code, name, price_fen, price_yuan, grant_recharge_micro, grant_bonus_micro,
                 bonus_valid_days, rpm, tpm, concurrency, permanent, purchasable, sort_order]
      description: 一个档位；全部数值来自 t_plan（PRD §3.2.1 为唯一来源）
      properties:
        id: {type: integer, format: int64}
        code: {type: string, description: "TRIAL / STANDARD / PRO / ENTERPRISE / FREE_DEFAULT"}
        name: {type: string}
        price_fen: {type: integer, format: int64, description: 售价（分）}
        price_yuan: {type: integer, format: int64, description: 售价（元，整数展示）}
        grant_recharge_micro: {type: integer, format: int64, description: 充值积分（微积分）}
        grant_bonus_micro: {type: integer, format: int64, description: 赠送积分（微积分）}
        grant_recharge: {type: integer, format: int64, description: 充值积分（积分）}
        grant_bonus: {type: integer, format: int64, description: 赠送积分（积分）}
        bonus_valid_days: {type: integer, format: int64}
        rpm: {type: integer, format: int64}
        tpm: {type: integer, format: int64}
        concurrency: {type: integer, format: int64}
        daily_quota_micro: {type: [integer, "null"], format: int64, description: "null = 无上限（默认档）"}
        daily_quota: {type: [integer, "null"], format: int64, description: "账户日额度（积分）"}
        permanent: {type: boolean, description: "权益有效期永久（付费三档为 true）"}
        purchasable: {type: boolean, description: "price_fen > 0；默认档与体验档为 false"}
        sort_order: {type: integer, format: int64, description: 档位顺序：体验 < 标准 < 专业 < 企业}
    PlanList:
      type: object
      required: [items, default_tier, default_tier_label, trial_days, bonus_expire_days, micro_per_credit]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Plan'}
        default_tier: {type: string, description: 未购套餐时的档位 code（FREE_DEFAULT）}
        default_tier_label: {type: string, description: plan.default_tier 配置值}
        trial_days: {type: integer, format: int64, description: plan.trial_days}
        bonus_expire_days: {type: integer, format: int64, description: billing.bonus_expire_days}
        micro_per_credit: {type: integer, format: int64, description: 恒为 10000}
    Order:
      type: object
      required: [id, order_no, order_type, pay_amount_fen, pay_amount_yuan,
                 recharge_micro, bonus_micro, pay_channel, state, expire_at, created_at]
      properties:
        id: {type: integer, format: int64}
        order_no: {type: string, description: yyyymmddHHmmss + 14 位随机（28 字符）}
        order_type: {type: string, enum: [CUSTOM, PLAN]}
        plan_code: {type: string}
        pay_amount_fen: {type: integer, format: int64, description: 实付（分）}
        pay_amount_yuan: {type: integer, format: int64}
        recharge_micro: {type: integer, format: int64}
        bonus_micro: {type: integer, format: int64}
        recharge: {type: integer, format: int64}
        bonus: {type: integer, format: int64}
        pay_channel: {type: string, enum: [WECHAT, ALIPAY]}
        state: {type: string, enum: [PENDING, PAID, CLOSED, REFUNDING, REFUNDED, PARTIAL_REFUNDED]}
        paid_at: {type: [string, "null"], format: date-time}
        expire_at: {type: string, format: date-time, description: 下单 + 30 分钟}
        created_at: {type: string, format: date-time}
    OrderList:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Order'}
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer, format: int64}
    CreateOrderRequest:
      type: object
      required: [order_type, pay_channel]
      properties:
        order_type: {type: string, enum: [CUSTOM, PLAN]}
        plan_id: {type: integer, format: int64, description: "PLAN 必填；CUSTOM 不得出现"}
        pay_amount_fen: {type: integer, format: int64, description: "CUSTOM 必填（1~5000000）；PLAN 若传必须等于档位价"}
        pay_channel: {type: string, enum: [WECHAT, ALIPAY], description: "OFFLINE（对公转账）不走自动回调，V1.0 不开放"}
        idempotency_key: {type: string, maxLength: 128, description: "也可用同名请求头；10s 窗口"}
    CreatedOrder:
      type: object
      required: [order, idempotent_replay]
      properties:
        order: {$ref: '#/components/schemas/Order'}
        idempotent_replay: {type: boolean, description: true = 同一 Idempotency-Key 的重放，未新建订单}
    RedeemRequest:
      type: object
      required: [code]
      properties:
        code: {type: string, minLength: 6, maxLength: 64, description: 兑换码明文；服务端只存 SHA-256}
    RedeemResult:
      type: object
      required: [batch_name, amount_micro, amount, credit_target, expire_at, balance_after_micro]
      properties:
        batch_name: {type: string}
        amount_micro: {type: integer, format: int64}
        amount: {type: integer, format: int64, description: 积分}
        credit_target: {type: string, enum: [BONUS, RECHARGE], description: "B-44 A 档固定 BONUS（不可退）"}
        expire_at: {type: string, format: date-time}
        balance_after_micro: {type: integer, format: int64}
    PayCallbackRequest:
      type: object
      required: [out_trade_no, trade_no, amount_fen, status, sign]
      properties:
        out_trade_no: {type: string, maxLength: 28, description: 本平台订单号}
        trade_no: {type: string, maxLength: 64, description: 渠道流水号（uk_ro_pay_txn 幂等键）}
        amount_fen: {type: integer, format: int64, description: 实付（分），必须与订单一致且参与验签}
        status: {type: string, enum: [SUCCESS, FAILED]}
        sign: {type: string, description: "hex(HMAC-SHA256(secret, out_trade_no|trade_no|amount_fen|status))"}
    PayCallbackAck:
      type: object
      required: [code, credited, replayed]
      properties:
        code: {type: string, description: 固定 SUCCESS（渠道约定，非统一错误体）}
        order_no: {type: string}
        credited: {type: boolean, description: true = 本次或此前已入账}
        replayed: {type: boolean, description: true = 重复通知，未重复入账}
        reason: {type: string, description: "ORDER_NOT_FOUND / ORDER_CLOSED / ORDER_REFUNDED / PAY_TXN_MISMATCH / CHANNEL_REPORTED_FAILURE"}
    Refund:
      type: object
      required: [id, refund_no, recharge_order_id, apply_micro, refund_micro, refund_fen, fee_fen, state, created_at]
      properties:
        id: {type: integer, format: int64}
        refund_no: {type: string, description: 28 位退款单号}
        recharge_order_id: {type: integer, format: int64}
        apply_micro: {type: integer, format: int64, description: 申请退款积分（微积分）}
        apply_credits: {type: integer, format: int64, description: 申请退款积分（积分 = micro / 10000）}
        refund_micro: {type: integer, format: int64, description: 实际退款积分基数（= apply_micro）}
        refund_credits: {type: integer, format: int64}
        refund_fen: {type: integer, format: int64, description: 退回人民币（分）= micro × 9 / 100000}
        refund_yuan: {type: integer, format: int64, description: 元（整除，展示用；分位见 refund_fen % 100）}
        fee_fen: {type: integer, format: int64, description: 手续费（分）= 可退积分 − refund_fen}
        fee_yuan: {type: integer, format: int64}
        state: {type: string, enum: [APPLIED, APPROVED, REJECTED, PAYING, PAID, FAILED]}
        reject_reason: {type: string, nullable: true}
        fail_reason: {type: string, nullable: true}
        pay_txn_id: {type: string, nullable: true, description: 原路退回渠道流水号}
        auditor_id: {type: integer, format: int64, nullable: true}
        audited_at: {type: string, format: date-time, nullable: true}
        paid_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}
    RefundList:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Refund'}
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer, format: int64}
    CreateRefundRequest:
      type: object
      required: [recharge_order_id]
      properties:
        recharge_order_id: {type: integer, format: int64, description: 必须属于当前账号且 state=PAID}
        idempotency_key: {type: string, maxLength: 128, description: 也可用同名请求头；10s 窗口}
    CreatedRefund:
      type: object
      required: [refund, idempotent_replay]
      properties:
        refund: {$ref: '#/components/schemas/Refund'}
        idempotent_replay: {type: boolean}
    Invoice:
      type: object
      required: [id, apply_no, recharge_order_id, invoice_type, title_type, title, receive_email, amount_fen, state, created_at]
      properties:
        id: {type: integer, format: int64}
        apply_no: {type: string}
        recharge_order_id: {type: integer, format: int64}
        invoice_type: {type: string, enum: [VAT_NORMAL_E]}
        title_type: {type: string, enum: [PERSONAL, COMPANY]}
        title: {type: string, maxLength: 128}
        tax_no: {type: string, maxLength: 32, nullable: true, description: "COMPANY 必填"}
        receive_email: {type: string, maxLength: 254}
        amount_fen: {type: integer, format: int64}
        amount_yuan: {type: integer, format: int64}
        tax_rate_bp: {type: integer, format: int64, description: "V1.0 固定 10000（1.00，Q-03），不做价税分离"}
        state: {type: string, enum: [APPLIED, APPROVED, ISSUED, REJECTED, VOIDED]}
        reject_reason: {type: string, nullable: true}
        invoice_url: {type: string, nullable: true}
        auditor_id: {type: integer, format: int64, nullable: true}
        issued_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}
    InvoiceList:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Invoice'}
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer, format: int64}
    CreateInvoiceRequest:
      type: object
      required: [recharge_order_id, title_type, title, receive_email]
      properties:
        recharge_order_id: {type: integer, format: int64}
        title_type: {type: string, enum: [PERSONAL, COMPANY]}
        title: {type: string, maxLength: 128}
        tax_no: {type: string, maxLength: 32, description: "title_type=COMPANY 时必填"}
        receive_email: {type: string, maxLength: 254}
        amount_fen: {type: integer, format: int64, description: "省略 = 剩余可开金额；超过剩余额度即拒绝"}
        idempotency_key: {type: string, maxLength: 128}
    CreatedInvoice:
      type: object
      required: [invoice, idempotent_replay]
      properties:
        invoice: {$ref: '#/components/schemas/Invoice'}
        idempotent_replay: {type: boolean}
    QuotaApply:
      type: object
      required: [id, apply_no, current_quota_micro, used_at_apply_micro, target_quota_micro, apply_reason, state, created_at]
