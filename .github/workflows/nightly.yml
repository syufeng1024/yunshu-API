name: nightly

on:
  schedule:
    # 18:00 UTC = 02:00 Asia/Shanghai.
    - cron: "0 18 * * *"
  workflow_dispatch:
    # The scheduled run always uses the PRD target (200 QPS / 10m). The inputs
    # exist so a capacity question can be answered with a 2-minute run instead
    # of guessing from a 10-minute red.
    inputs:
      qps:
        description: "Target QPS (PRD §9.4 target is 200)"
        required: false
        default: "200"
      duration:
        description: "Load duration (PRD soak is 10m)"
        required: false
        default: "10m"

jobs:
  gwt:
    name: full GWT + R-01..R-08 + ledger invariants
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: yunshu_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      TEST_DB_DSN: "root:test@tcp(127.0.0.1:3306)/yunshu_test?parseTime=true&loc=UTC&charset=utf8mb4&multiStatements=true"
      TEST_REDIS_ADDR: "127.0.0.1:6379"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: GWT + reconciliation + invariants
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 -v \
            -run 'TestGWT|TestR0|TestInvariant' \
            ./internal/acceptance/ ./internal/recon/ ./internal/ledger/ \
            2>&1 | tee nightly-gwt.log

      - name: upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-gwt-log
          path: nightly-gwt.log
          if-no-files-found: warn

  soak:
    name: soak (200 QPS, 10 minutes)
    runs-on: ubuntu-latest
    # The load itself is 10 minutes; anything past ~20 means the job is wedged
    # (service containers unreachable, goroutines leaked) and should stop
    # instead of burning the 360-minute default.
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: yunshu_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      TEST_DB_DSN: "root:test@tcp(127.0.0.1:3306)/yunshu_test?parseTime=true&loc=UTC&charset=utf8mb4&multiStatements=true"
      TEST_REDIS_ADDR: "127.0.0.1:6379"
      SOAK_QPS: ${{ inputs.qps || '200' }}
      SOAK_DURATION: ${{ inputs.duration || '10m' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: soak
        shell: bash
        run: |
          set -o pipefail
          # -timeout must exceed SOAK_DURATION plus seeding: `go test` defaults
          # to 10m, which equals the load itself, so nightly #1 panicked with
          # "test timed out after 10m0s" while still inside the tick loop and
          # never reached the P99 / error-rate assertions.
          go test -tags soak -timeout 20m -count=1 -v -run TestSoak ./internal/load/ \
            2>&1 | tee nightly-soak.log

      - name: upload soak log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-soak-log
          path: nightly-soak.log
          if-no-files-found: warn
