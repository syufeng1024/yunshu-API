# 前端站点：静态资源 + 反代控制面。
#
# 站点与控制面同源是刻意设计——浏览器只看到一个 origin，cookie 与会话签名
# 都不需要跨域策略；生产换域名时也只改这里，不动前端构建。
#
# TLS 的边界：本文件只监听 80，不解密任何流量。生产环境由前置网关 / SLB 终止
# TLS，再把明文请求转发到这里。容器不持有证书，续期和加密套件都在那一层，
# 这样换证书不需要重启应用。

# controld 的容器内地址。用变量而不是字面量，是为了让 nginx 在启动时不必解析
# 一个可能还没起来的容器名：配合下面的 resolver，每次请求才重新解析。
resolver 127.0.0.11 valid=10s ipv6=off;

# TLS 在 SLB 终止时，nginx 看到的 $scheme 永远是 http。如果直接把它传给应用，
# 应用会认为自己在明文协议下，从而漏掉 Secure cookie、生成 http 的绝对 URL。
# 这里优先采信上游给的 X-Forwarded-Proto，没有才回落到 $scheme。
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源指纹：vite 产物文件名带 hash，可以长缓存。
    # 只用 add_header，不用 expires——两者同时写会输出两条 Cache-Control。
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 入口文件绝不缓存，否则发版后浏览器会拿到旧的 index.html 指向已删除的 chunk。
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    set $control http://controld:8081;

    # 健康检查：只对回环与私网开放。
    #
    # /readyz 的响应体会逐个列出 redis / mysql / config 的状态，等于把内部
    # 依赖拓扑告诉任何能访问它的人；/healthz 无害但也没有公开的理由。生产
    # 探针应该来自 SLB / K8s 的私网地址，落在下面这几个网段里。
    #
    # 如果探针源是公网 IP（例如 SLB 用公网回源），把它单独加一行 allow，
    # 不要图省事改成 allow all。
    #
    # 注意：容器自身的 healthcheck 不走这里——web 探的是 /index.html，
    # gatewayd / controld 直接探各自的 8080 / 8081，所以收紧这段不影响编排。
    location = /healthz {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass $control/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /readyz {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass $control/readyz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # T27：调试台的内部调用入口只走容器网络。
    # gatewayd 的 /internal/ 靠 HMAC 兜底，但不应该让公网有机会把它送到
    # 验签代码面前；这里直接 404，构成第二道门。
    # 用 ^~ 前缀匹配，防止被下面的正则 location 抢走。
    # 注意：本文件（default.conf）才是 web 容器加载的那份
    # （deploy/Dockerfile.web:36）；gateway.conf 是灰度入口的另一份配置。
    location ^~ /internal/ {
        return 404;
    }

    # 控制面 API：后端只认 /api/ 前缀（internal/control/server.go 里所有
    # mux.Handle 都以 /api/ 开头）。这里必须只写 /api/。
    # 早期写成 ^/(api|console|admin)/ 是错的：/console/* 与 /admin/* 是
    # SPA 的页面路由，被这条规则抢去代理后，controld 找不到对应路由，
    # 直接返回纯文本 "404 page not found"——控制台 9 页与运营后台 8 页
    # 全部无法直达或刷新（2026-10-29 浏览器实测发现）。
    # 用 ^~ 前缀匹配，避免被下面的正则 location 抢。
    location ^~ /api/ {
        proxy_pass $control;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # 控制面将来会有导出、对账报表这类长响应，默认 60s 偏紧。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # SPA 兜底：前台路由（/pricing、/docs/...）刷新不能 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏 nginx 版本号。
    server_tokens off;
}
