# gatewayd 灰度入口。
#
# 分流分两段，缺一不可：
#   1. split_clients 决定这个请求进 stable 还是 canary 池，10% 走 canary；
#   2. 池内再用 consistent hash 把同一 Authorization 稳定落到同一副本。
#
# 禁止使用 request_id 变量：它每个请求都重新生成，等于随机分流，同一 Key
# 会在两个池之间来回跳，预热、限流和幂等都会失效。灰度脚本按步长改写下面
# 这一行的百分比，格式必须保持 `<数字>% canary;`。

split_clients "$http_authorization" $gw_pool {
    # 这个数字是灰度脚本唯一要改的地方（sed 匹配行首的百分比）。
    10%     canary;
    *       stable;
}

# 第二段：池内一致性哈希。没有它，同一个 Key 在 3 个 gatewayd 副本之间
# 抖动，幂等租约、限流窗口和连接复用都会被打散。
upstream gateway_stable {
    hash $http_authorization consistent;
    server gateway-stable:8080;
}

upstream gateway_canary {
    hash $http_authorization consistent;
    server gateway-canary:8080;
}

server {
    listen 80;
    server_name _;

    # 先按池做内部重定向，再进入静态 upstream。这样 proxy_pass 的目标是
    # upstream 组名而不是变量，nginx 启动时解析一次即可，不需要 resolver，
    # 也不会在每次请求上重跑 DNS。
    location /v1/ {
        if ($gw_pool = canary) {
            rewrite ^ /_canary$request_uri last;
        }
        rewrite ^ /_stable$request_uri last;
    }

    # 两个内部 location 的转发参数必须逐字一致，否则灰度对比会混入
    # 代理层差异。SSE 需要关闭缓冲并把读超时放宽到客户端的 600s 预算。
    location /_stable/ {
        internal;
        proxy_pass http://gateway_stable/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /_canary/ {
        internal;
        proxy_pass http://gateway_canary/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
