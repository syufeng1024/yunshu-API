# 凭据模板。复制后把每个占位值替换成真实值，不要提交填充后的文件。
#
# 只登记键名：DB_DSN 同时被 gatewayd 的 GW_WRITE_DSN / LOG_SQL_DSN 引用；
# 独立日志库或只读账号时，再拆成独立 Secret，而不是放宽这里的键。
apiVersion: v1
kind: Secret
metadata:
  name: yunshu-secrets
  namespace: yunshu
  labels:
    app.kubernetes.io/part-of: yunshu
type: Opaque
stringData:
  DB_DSN: "<set-me>"
  REDIS_PASSWORD: "<set-me>"
  SESSION_SECRET: "<set-me>"
  CHANNEL_KEY_KEK: "<set-me>"
  GATEWAY_METRICS_TOKEN: "<set-me>"
