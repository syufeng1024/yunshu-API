# T21: narrow first adoption. The repository already has eight bespoke
# hard-constraint scans in scripts/lint.sh; golangci-lint adds the two
# high-signal vet-class checks without turning an existing style backlog into
# a red build. Widen deliberately, one linter at a time.
run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - govet
    - ineffassign

issues:
  exclude-dirs:
    - web
    - relaykit
